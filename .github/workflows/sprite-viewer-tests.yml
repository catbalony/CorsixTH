name: Sprite viewer Lua tests (manual)

# Free-plan Actions minutes are limited. Do not execute this workflow on pushes
# or pull requests; maintainers run scripts/run-sprite-viewer-tests.sh locally.
# The Actions run is opt-in for a deliberate remote diagnostic.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Run sprite viewer helper tests
        run: bash scripts/run-sprite-viewer-tests.sh
