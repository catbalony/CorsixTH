name: Apply issue 826 follow-up performance patch

on:
  push:
    branches:
      - review/issue-826-perf2-apply

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: review/issue-826-perf2-apply
          fetch-depth: 0
      - name: Apply follow-up performance patch to clean review head
        shell: bash
        run: |
          cat .github/perf2part_00.diff \
              .github/perf2part_01.diff > /tmp/perf2_826.diff
          git fetch origin review/issue-826-final
          git checkout --detach origin/review/issue-826-final
          git apply --check /tmp/perf2_826.diff
          git apply /tmp/perf2_826.diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CorsixTH/Lua/dialogs/edit_room.lua \
                  CorsixTH/Lua/world.lua \
                  CorsixTH/Luatest/spec/blocking_off_area_ui_spec.lua \
                  CorsixTH/Luatest/spec/world_spec.lua
          git commit -m "Reuse ingress components in #826 endpoint checks"
          git push origin HEAD:refs/heads/review/issue-826-perf2-applied
